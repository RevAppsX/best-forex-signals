name: 1-Hour Urgent Economic Alert

on:
  schedule:
    # Runs every 30 minutes Monday to Friday to check for imminent high-impact releases
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

jobs:
  check-urgent-news:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore alert cache
        uses: actions/cache@v4
        with:
          path: .alerts_cache.json
          key: alerts-cache-${{ github.run_id }}
          restore-keys: |
            alerts-cache-

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check and Alert Imminent News
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python news_urgent_alert.py
