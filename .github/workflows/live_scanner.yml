name: Live Real-Time Market Scanner

on:
  schedule:
    # Scans every 2 hours 24/7 across 20+ Forex, Crypto & Metal assets
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scan-market:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Restore scanner cache
        uses: actions/cache@v4
        with:
          path: .scanner_cache.json
          key: scanner-cache-${{ github.run_id }}
          restore-keys: |
            scanner-cache-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Live Opportunity Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python live_market_scanner.py
