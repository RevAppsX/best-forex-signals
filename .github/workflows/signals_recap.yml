name: Daily Signal Performance Recap

on:
  schedule:
    # Runs daily at 21:00 UTC (00:00 TRT / 5:00 PM EST - Official Daily Market Close)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  send-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Run Daily Recap Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python signals_recap.py
